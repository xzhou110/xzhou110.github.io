  <g fill="none" stroke="#faf9f6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- open book -->
    <path d="M256 176 C 216 150, 160 150, 118 166 V 356 C 160 340, 216 340, 256 366 Z"/>
    <path d="M256 176 C 296 150, 352 150, 394 166 V 356 C 352 340, 296 340, 256 366 Z"/>
    <line x1="256" y1="176" x2="256" y2="366"/>
  </g>
  <!-- a lit point above the spine: the idea that rises from the page -->
  <circle cx="256" cy="120" r="22" fill="#f3e9d8"/>
</svg>
